plugins {
    id 'com.android.library'
    id 'expo-module-gradle-plugin'
}

group = 'com.touchgrassmodule'
version = '1.0.0'

android {
    namespace "com.touchgrassmodule"

    defaultConfig {
        versionCode 1
        versionName "1.0.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    lintOptions {
        abortOnError false
    }
}
