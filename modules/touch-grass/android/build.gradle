apply plugin: 'com.android.library'
apply plugin: 'expo-module'

group = 'com.touchgrass'
version = '1.0.0'

android {
    namespace "com.touchgrass"
    compileSdkVersion 35

    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 35
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    lintOptions {
        abortOnError false
    }
}
